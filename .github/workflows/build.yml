name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build DMG
        run: make dmg
      - uses: actions/upload-artifact@v4
        with:
          name: Karuta
          path: build/*.dmg
          retention-days: 7
