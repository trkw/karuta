name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build app
        run: make app
      - name: Zip app
        run: cd build && ditto -c -k --keepParent Karuta.app Karuta.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Karuta
          path: build/Karuta.zip
          retention-days: 7
