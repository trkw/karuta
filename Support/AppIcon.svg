<circle cx="300" cy="230" r="300" fill="#FFFFFF" opacity=".10"/>
</g>
<g transform="rotate(12 540 540)">
<rect x="372" y="282" width="356" height="496" rx="34" fill="#FFFFFF" fill-opacity=".22" stroke="#FFFFFF" stroke-opacity=".55" stroke-width="4"/>
</g>
<g transform="rotate(-7 500 520)">
