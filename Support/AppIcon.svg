<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
<!-- Karuta アプリアイコン。変更したら make icon で AppIcon.icns を作り直す -->
<defs>
<clipPath id="sq">
<path d="M512 100c-210 0-305 0-358 53s-53 148-53 358v2c0 210 0 305 53 358s148 53 358 53 305 0 358-53 53-148 53-358v-2c0-210 0-305-53-358S722 100 512 100z"/>
</clipPath>
<filter id="plate" x="-40%" y="-40%" width="180%" height="190%">
<feGaussianBlur in="SourceAlpha" stdDeviation="12"/>
<feOffset dy="10"/>
<feComponentTransfer>
<feFuncA type="linear" slope="0.3"/>
</feComponentTransfer>
<feMerge>
<feMergeNode/>
<feMergeNode in="SourceGraphic"/>
</feMerge>
</filter>
<filter id="lift" x="-40%" y="-40%" width="180%" height="190%">
<feGaussianBlur in="SourceAlpha" stdDeviation="28"/>
<feOffset dy="26"/>
<feComponentTransfer>
<feFuncA type="linear" slope="0.45"/>
</feComponentTransfer>
<feMerge>
<feMergeNode/>
<feMergeNode in="SourceGraphic"/>
</feMerge>
</filter>
<filter id="tight" x="-40%" y="-40%" width="180%" height="190%">
<feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
<feOffset dy="6"/>
<feComponentTransfer>
<feFuncA type="linear" slope="0.3"/>
</feComponentTransfer>
<feMerge>
<feMergeNode/>
<feMergeNode in="SourceGraphic"/>
</feMerge>
</filter>
<linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#FFFFFF" stop-opacity=".55"/>
<stop offset=".4" stop-color="#FFFFFF" stop-opacity=".06"/>
<stop offset="1" stop-color="#000000" stop-opacity=".3"/>
</linearGradient>
<linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#FAFBFD"/>
<stop offset=".5" stop-color="#B9BECB"/>
<stop offset="1" stop-color="#6E7484"/>
</linearGradient>
<linearGradient id="metal2" x1="0" y1="1" x2="0" y2="0">
<stop offset="0" stop-color="#F2F3F7"/>
<stop offset="1" stop-color="#5D6271"/>
</linearGradient>
<radialGradient id="iris" cx=".5" cy=".5" r=".5">
<stop offset="0" stop-color="#0A0B1E"/>
<stop offset=".35" stop-color="#1B1460"/>
<stop offset=".62" stop-color="#5B3BFF"/>
<stop offset=".8" stop-color="#22C6FF"/>
<stop offset=".9" stop-color="#FF5FB0"/>
