<ellipse cx="453.2" cy="444.8" rx="42.0" ry="23.1" transform="rotate(-38 453.2 444.8)" fill="#FFFFFF" opacity=".85"/>
<circle cx="575.0" cy="575.0" r="12.6" fill="#9FF0FF" opacity=".8"/>
