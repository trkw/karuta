<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
<!-- Karuta アプリアイコン。「か」は IPA ゴシックのグリフをパス化したもの。変更したら make icon で AppIcon.icns を作り直す -->
<defs>
<filter id="plate" x="-30%" y="-30%" width="160%" height="160%">
<feGaussianBlur in="SourceAlpha" stdDeviation="14"/>
<feOffset dy="10"/>
<feComponentTransfer>
<feFuncA type="linear" slope="0.35"/>
</feComponentTransfer>
<feMerge>
<feMergeNode/>
<feMergeNode in="SourceGraphic"/>
</feMerge>
</filter>
<filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
<feGaussianBlur in="SourceAlpha" stdDeviation="26"/>
<feOffset dy="22"/>
<feComponentTransfer>
<feFuncA type="linear" slope="0.45"/>
</feComponentTransfer>
<feMerge>
<feMergeNode/>
<feMergeNode in="SourceGraphic"/>
</feMerge>
</filter>
<filter id="tight" x="-30%" y="-30%" width="160%" height="160%">
<feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
<feOffset dy="6"/>
<feComponentTransfer>
<feFuncA type="linear" slope="0.35"/>
</feComponentTransfer>
<feMerge>
<feMergeNode/>
<feMergeNode in="SourceGraphic"/>
</feMerge>
</filter>
<linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#FFFFFF" stop-opacity=".28"/>
<stop offset=".45" stop-color="#FFFFFF" stop-opacity="0"/>
<stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
</linearGradient>
<linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#FFFFFF" stop-opacity=".45"/>
<stop offset=".5" stop-color="#FFFFFF" stop-opacity=".05"/>
<stop offset="1" stop-color="#000000" stop-opacity=".25"/>
</linearGradient>
<linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#FFFEFA"/>
<stop offset="1" stop-color="#EFE3C8"/>
</linearGradient>
<linearGradient id="red" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#F05A44"/>
<stop offset="1" stop-color="#B3231A"/>
</linearGradient>
<linearGradient id="gloss" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#FFFFFF" stop-opacity=".9"/>
<stop offset=".5" stop-color="#FFFFFF" stop-opacity="0"/>
</linearGradient>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#46B4FF"/>
<stop offset=".55" stop-color="#5A5CFF"/>
<stop offset="1" stop-color="#9B3DF5"/>
</linearGradient>
<clipPath id="sq">
<path d="M512 100c-210 0-305 0-358 53s-53 148-53 358v2c0 210 0 305 53 358s148 53 358 53 305 0 358-53 53-148 53-358v-2c0-210 0-305-53-358S722 100 512 100z"/>
</clipPath>
</defs>
<g filter="url(#plate)">
<path d="M512 100c-210 0-305 0-358 53s-53 148-53 358v2c0 210 0 305 53 358s148 53 358 53 305 0 358-53 53-148 53-358v-2c0-210 0-305-53-358S722 100 512 100z" fill="url(#bg)"/>
</g>
<path d="M512 100c-210 0-305 0-358 53s-53 148-53 358v2c0 210 0 305 53 358s148 53 358 53 305 0 358-53 53-148 53-358v-2c0-210 0-305-53-358S722 100 512 100z" fill="url(#sheen)"/>
<path d="M512 100c-210 0-305 0-358 53s-53 148-53 358v2c0 210 0 305 53 358s148 53 358 53 305 0 358-53 53-148 53-358v-2c0-210 0-305-53-358S722 100 512 100z" fill="none" stroke="url(#edge)" stroke-width="4"/>
