<rect x="319.5" y="263.5" width="367" height="517" rx="36" fill="none" stroke="#FFFFFF" stroke-opacity=".8" stroke-width="3"/>
</g>
<g filter="url(#tight)">
<path  d="M214 284V188H310 M714 188H810V284 M810 768V864H714 M310 864H214V768" fill="none" stroke="#FFFFFF" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
