</radialGradient>
<radialGradient id="dome" cx=".35" cy=".25" r=".8">
<stop offset="0" stop-color="#FFFFFF" stop-opacity=".55"/>
<stop offset=".35" stop-color="#FFFFFF" stop-opacity=".05"/>
