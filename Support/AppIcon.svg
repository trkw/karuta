</g>
<circle cx="512" cy="512" r="180.6" fill="url(#metal2)"/>
<circle cx="512" cy="512" r="163.8" fill="#07080F"/>
<circle cx="512" cy="512" r="151.2" fill="url(#iris)"/>
<circle cx="512" cy="512" r="46.2" fill="#03040A"/>
